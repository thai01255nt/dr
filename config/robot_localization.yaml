# ========================================
# OUTPUT SETTINGS
# ========================================

# Publish the transformation between frames
publish_tf: true

# Publish acceleration state
publish_acceleration: false

# Use control input (cmd_vel) if available
# Set to false if you don't have control commands or don't want to use them
use_control: false

# Stamped control (twist with header)
stamped_control: false

# Control timeout (seconds)
control_timeout: 0.2

# Debugging
print_diagnostics: true

# The name of the node's diagnostic status
diagnostic_updater_frequency: 1.0
